[workspace]
resolver = "2"
members = ["crates/varyk-syntax", "crates/varyk"]
# So plain `cargo build` on a package `varyk init` wrote under either
# directory (test fixture copies land in `target/`; `examples/packages`
# holds committed example packages) never "believes it's in a workspace":
# these directory prefixes are outside the compiler's own workspace.
exclude = ["target", "examples/packages"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Vlad Mickevic"]
repository = "https://github.com/Varyk-Lang/varyk"
homepage = "https://varyk.com"
rust-version = "1.85"
