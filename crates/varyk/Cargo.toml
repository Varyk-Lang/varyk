[package]
name = "varyk"
version = "0.7.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Build backend services simply and ship Rust binaries: an experimental language for APIs, workers, and microservices that compiles to Rust"
readme = "../../README.md"
keywords = ["language", "compiler", "rust", "backend", "transpiler"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "varyk"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.12.16"
clap = { version = "4.6.7", features = ["derive"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "visit"] }
toml = "1"
varyk-syntax = { path = "../varyk-syntax", version = "0.7.2" }

[dev-dependencies]
insta = "1.48.0"
